// ==================== HELPERS ====================
const DAYS = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SABADO"];
const DAYS_SHORT = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
const HOURS = Array.from({ length: 25 }, (_, i) => `${String(i).padStart(2, "0")}h`);

const parseNum = (v) => {
  if (v === undefined || v === null || v === "") return 0;
  const s = String(v).replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const parsePct = (v) => {
  if (!v) return 0;
  const s = String(v).replace("%", "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

// Parse CSV no formato: [Semana/Hora] + 7 dias × (WIN, LOSS, WINRATE)
function parseSignalsCSV(csvText) {
  const parsed = Papa.parse(csvText, { skipEmptyLines: false });
  const rows = parsed.data;
  const weeks = [];
  let currentWeek = null;

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const first = String(row[0] || "").trim();
    if (!first) continue;

    // Detectar início de semana (ex: "SEMANA 05/04 - 11/04")
    if (/SEMANA/i.test(first)) {
      if (currentWeek) weeks.push(currentWeek);
      currentWeek = {
        label: first,
        hours: {}, // { "3h": { DOMINGO: {win,loss,winrate}, ... } }
        totals: {},
        banca: {},
        entrada: {},
        valorDia: {},
        valorReais: {},
      };
      continue;
    }

    if (!currentWeek) continue;

    // Linhas de hora: 00h, 1h, 2h ... 24h (padronizar sempre pra 2 dígitos)
    if (/^\d+h$/i.test(first)) {
      const hourData = {};
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        const win = parseNum(row[baseCol]);
        const loss = parseNum(row[baseCol + 1]);
        const wr = parsePct(row[baseCol + 2]);
        hourData[DAYS[d]] = { win, loss, winrate: wr };
      }
      // Normalizar chave: "1h" -> "01h", "00h" -> "00h"
      const hourNum = parseInt(first.replace("h", ""), 10);
      const normKey = `${String(hourNum).padStart(2, "0")}h`;
      currentWeek.hours[normKey] = hourData;
      continue;
    }

    if (/^TOTAL$/i.test(first)) {
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        currentWeek.totals[DAYS[d]] = {
          win: parseNum(row[baseCol]),
          loss: parseNum(row[baseCol + 1]),
          winrate: parsePct(row[baseCol + 2]),
        };
      }
      continue;
    }

    if (/BANCA/i.test(first)) {
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        currentWeek.banca[DAYS[d]] = parseNum(row[baseCol]);
      }
      continue;
    }
    if (/ENTRADA/i.test(first)) {
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        currentWeek.entrada[DAYS[d]] = parseNum(row[baseCol]);
      }
      continue;
    }
    if (/VALOR DIA/i.test(first)) {
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        currentWeek.valorDia[DAYS[d]] = parseNum(row[baseCol]);
      }
      continue;
    }
    if (/VALOR EM REAIS|REAIS/i.test(first)) {
      for (let d = 0; d < 7; d++) {
        const baseCol = 1 + d * 3;
        currentWeek.valorReais[DAYS[d]] = parseNum(row[baseCol]);
      }
      continue;
    }
  }
  if (currentWeek) weeks.push(currentWeek);
  return weeks;
}

// Fundir semanas evitando duplicatas (mesmo label sobrescreve)
function mergeWeeks(existing, incoming) {
  const map = new Map();
  [...existing, ...incoming].forEach((w) => map.set(w.label, w));
  return Array.from(map.values());
}

// ==================== PARSER OPERAÇÕES GRANULARES (DIAMONDS) ====================
// Formato: HORA;TIMEFRAME;ATIVO;ESTRATEGIA;CONFLUENCIA;TIPO;PRECO;RESULTADO
function parseOpsCSV(csvText, filename = "") {
  const parsed = Papa.parse(csvText, {
    delimiter: ";",
    header: true,
    skipEmptyLines: true,
    transformHeader: (h) => h.trim().replace(/^\uFEFF/, ""),
  });
  // Detectar data pelo nome do arquivo (ex: 18_04_-_DAIMONDS.csv -> 2026-04-18)
  // Aceita formatos: "18_04", "18-04", "18/04", "18_04_2026"
  const m = filename.match(/(\d{1,2})[_\-/](\d{1,2})(?:[_\-/](\d{2,4}))?/);
  let date = new Date().toISOString().slice(0, 10);
  if (m) {
    const day = m[1].padStart(2, "0");
    const month = m[2].padStart(2, "0");
    let year = m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : "2026";
    date = `${year}-${month}-${day}`;
  }

  const ops = [];
  for (const row of parsed.data) {
    if (!row.HORA || !row.RESULTADO) continue;
    const rankMatch = String(row.CONFLUENCIA || "").match(/(RANK \d+)/);
    const ativo = String(row.ATIVO || "").trim().replace(/DIAMOND$/i, "");
    ops.push({
      id: `${date}_${row.HORA}_${ativo}_${Math.random().toString(36).slice(2, 7)}`,
      date,
      time: String(row.HORA).trim(),
      timeframe: String(row.TIMEFRAME || "").trim(),
      ativo,
      strategy: String(row.ESTRATEGIA || "").trim(),
      rank: rankMatch ? rankMatch[1] : (row.CONFLUENCIA || "").trim(),
      rankFull: String(row.CONFLUENCIA || "").trim(),
      type: String(row.TIPO || "").trim().toUpperCase(),
      price: parseFloat(String(row.PRECO || "0").replace(",", ".")) || 0,
      result: String(row.RESULTADO).trim().toUpperCase(),
    });
  }
  return ops;
}

// Detecta formato do CSV
function detectFormat(csvText) {
  const firstLine = csvText.split("\n")[0] || "";
  const clean = firstLine.replace(/^\uFEFF/, "").toUpperCase();
  // Formato DIAMONDS: contém HORA;TIMEFRAME;ATIVO...
  if (clean.includes("TIMEFRAME") && clean.includes("ATIVO") && clean.includes("RESULTADO")) {
    return "ops";
  }
  // Formato semanal: contém SEMANA
  if (clean.includes("SEMANA") || clean.includes("WINRATE")) {
    return "weekly";
  }
  return "unknown";
}

// Fundir operações evitando duplicatas (mesma data+hora+ativo+tipo+rank)
function mergeOps(existing, incoming) {
  const key = (o) => `${o.date}_${o.time}_${o.ativo}_${o.type}_${o.rank}_${o.price}`;
  const map = new Map();
  [...existing, ...incoming].forEach((o) => map.set(key(o), o));
  return Array.from(map.values()).sort((a, b) =>
    a.date === b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date)
  );
}

// ==================== INTEGRAÇÃO OPS -> SEMANAL ====================
// Mapeia weekday JS (dom=0..sab=6) para nome do array DAYS
function getDayName(dateStr) {
  const d = new Date(dateStr + "T12:00:00"); // meio-dia evita problema de fuso
  return DAYS[d.getDay()];
}

// Calcula o rótulo da semana a partir da data (sempre DOMINGO a SABADO)
// Ex: 2025-04-18 -> "SEMANA 13/04 - 19/04"
function getWeekLabel(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  const dayOfWeek = d.getDay(); // 0=dom
  const sunday = new Date(d);
  sunday.setDate(d.getDate() - dayOfWeek);
  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate() + 6);
  const fmt = (x) => `${String(x.getDate()).padStart(2, "0")}/${String(x.getMonth() + 1).padStart(2, "0")}`;
  return `SEMANA ${fmt(sunday)} - ${fmt(saturday)}`;
}

// Agrega ops de UM dia em estrutura hora→{win,loss,winrate}
function aggregateOpsToDayHours(opsOfDay) {
  const hourStats = {};
  HOURS.forEach((h) => (hourStats[h] = { win: 0, loss: 0, winrate: 0 }));
  opsOfDay.forEach((o) => {
    if (o.result !== "WIN" && o.result !== "LOSS") return;
    const hourNum = parseInt(String(o.time).split(":")[0] || "0", 10);
    const key = `${String(hourNum).padStart(2, "0")}h`;
    if (!hourStats[key]) hourStats[key] = { win: 0, loss: 0, winrate: 0 };
    if (o.result === "WIN") hourStats[key].win++;
    else hourStats[key].loss++;
  });
  // Calcular winrate
  Object.values(hourStats).forEach((s) => {
    const t = s.win + s.loss;
    s.winrate = t > 0 ? (s.win / t) * 100 : 0;
  });
  return hourStats;
}

// Garante estrutura vazia de uma semana
function createEmptyWeek(label) {
  const week = {
    label,
    hours: {},
    totals: {},
    banca: {},
    entrada: {},
    valorDia: {},
    valorReais: {},
  };
  HOURS.forEach((h) => {
    week.hours[h] = {};
    DAYS.forEach((d) => (week.hours[h][d] = { win: 0, loss: 0, winrate: 0 }));
  });
  DAYS.forEach((d) => (week.totals[d] = { win: 0, loss: 0, winrate: 0 }));
  return week;
}

// Aplica ops no array de semanas — agrupa por data, determina semana/dia,
// e substitui os dados daquele dia pelo que veio das ops
function mergeOpsIntoWeeks(existingWeeks, ops) {
  // Clonar semanas pra não mutar
  const weeks = existingWeeks.map((w) => JSON.parse(JSON.stringify(w)));
  const weekMap = new Map(weeks.map((w) => [w.label, w]));

  // Agrupar ops por data
  const byDate = {};
  ops.forEach((o) => {
    if (!byDate[o.date]) byDate[o.date] = [];
    byDate[o.date].push(o);
  });

  Object.entries(byDate).forEach(([date, dayOps]) => {
    const weekLabel = getWeekLabel(date);
    const dayName = getDayName(date);
    let week = weekMap.get(weekLabel);
    if (!week) {
      week = createEmptyWeek(weekLabel);
      weeks.push(week);
      weekMap.set(weekLabel, week);
    }
    const dayHours = aggregateOpsToDayHours(dayOps);
    // Substituir dados daquele dia na semana (por hora)
    Object.entries(dayHours).forEach(([h, stats]) => {
      if (!week.hours[h]) {
        week.hours[h] = {};
        DAYS.forEach((d) => (week.hours[h][d] = { win: 0, loss: 0, winrate: 0 }));
      }
      week.hours[h][dayName] = stats;
    });
    // Recalcular totais daquele dia
    let totalW = 0, totalL = 0;
    Object.values(dayHours).forEach((s) => {
      totalW += s.win;
      totalL += s.loss;
    });
    const wr = totalW + totalL > 0 ? (totalW / (totalW + totalL)) * 100 : 0;
    week.totals[dayName] = { win: totalW, loss: totalL, winrate: wr };
  });

  // Ordenar semanas por data (ascendente)
  weeks.sort((a, b) => {
    const parse = (label) => {
      const m = label.match(/(\d{2})\/(\d{2})/);
      if (!m) return 0;
      return parseInt(m[2]) * 100 + parseInt(m[1]);
    };
    return parse(a.label) - parse(b.label);
  });
  return weeks;
}

// ==================== COMPONENT ====================
function SignalsDashboard() {
  const [weeks, setWeeks] = useState([]);
  const [ops, setOps] = useState([]);
  const [activeTab, setActiveTab] = useState("weekly"); // weekly | ops
  const [loading, setLoading] = useState(true);
  const [selectedWeek, setSelectedWeek] = useState("ALL");
  const [toast, setToast] = useState(null);
  const [simConfig, setSimConfig] = useState({
    bancaInicial: 200,
    percentEntrada: 3,
    payout: 89,
    cotacaoDolar: 5.20,
  });
  // Filtros da aba operações
  const [opsFilter, setOpsFilter] = useState({
    ativo: "ALL",
    rank: "ALL",
    type: "ALL",
    result: "ALL",
    date: "ALL",
  });
  const fileInputRef = useRef(null);

  // Carregar dados salvos (ou usar INITIAL_WEEKS na primeira vez)
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get("signals-weeks");
        let savedWeeks = [];
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed)) savedWeeks = parsed;
        }
        // Fundir INITIAL_WEEKS com o que estava salvo (INITIAL_WEEKS como base + salvos por cima)
        // mergeWeeks sobrescreve por label, então o que estava salvo "vence" se tiver mesmo label
        const merged = mergeWeeks(INITIAL_WEEKS, savedWeeks);
        setWeeks(merged);
      } catch (e) {
        setWeeks(INITIAL_WEEKS);
      }
      // Carregar operações e FUNDIR com INITIAL_OPS (evita perder os embutidos)
      try {
        const opsRes = await window.storage.get("signals-ops");
        let savedOps = [];
        if (opsRes && opsRes.value) {
          const parsed = JSON.parse(opsRes.value);
          if (Array.isArray(parsed)) savedOps = parsed;
        }
        // Se o storage tem menos ops que o INITIAL_OPS, provavelmente é sessão antiga
        // Fundir tudo: INITIAL_OPS como base + savedOps por cima (via mergeOps que deduplica)
        const merged = mergeOps(INITIAL_OPS, savedOps);
        setOps(merged);
      } catch (e) {
        setOps(INITIAL_OPS);
      }
      // Carregar config da simulação
      try {
        const cfg = await window.storage.get("signals-sim-config");
        if (cfg && cfg.value) {
          setSimConfig(JSON.parse(cfg.value));
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  // Salvar config de simulação
  useEffect(() => {
    if (loading) return;
    (async () => {
      try {
        await window.storage.set("signals-sim-config", JSON.stringify(simConfig));
      } catch (e) {}
    })();
  }, [simConfig, loading]);

  // Salvar ops
  useEffect(() => {
    if (loading) return;
    (async () => {
      try {
        await window.storage.set("signals-ops", JSON.stringify(ops));
      } catch (e) {}
    })();
  }, [ops, loading]);

  // Salvar sempre que mudar
  useEffect(() => {
    if (loading) return;
    (async () => {
      try {
        await window.storage.set("signals-weeks", JSON.stringify(weeks));
      } catch (e) {
        console.error(e);
      }
    })();
  }, [weeks, loading]);

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  };

  const handleFile = async (file) => {
    if (!file) return;
    try {
      const text = await file.text();
      const format = detectFormat(text);

      if (format === "ops") {
        const newOps = parseOpsCSV(text, file.name);
        if (newOps.length === 0) {
          showToast("Nenhuma operação encontrada no arquivo", "error");
          return;
        }
        // Alimentar operações granulares (pra análise detalhada)
        setOps((prev) => mergeOps(prev, newOps));
        // Alimentar também a estrutura semanal (agregando por dia/hora)
        setWeeks((prev) => mergeOpsIntoWeeks(prev, newOps));
        // Mostrar qual semana/dia foi atualizado
        const dates = [...new Set(newOps.map((o) => o.date))].sort();
        const summary = dates.map((d) => {
          const dn = getDayName(d);
          return `${d} (${dn.slice(0, 3)})`;
        }).join(", ");
        showToast(`${newOps.length} ops importadas · ${summary}`);
      } else if (format === "weekly") {
        const newWeeks = parseSignalsCSV(text);
        if (newWeeks.length === 0) {
          showToast("Nenhuma semana encontrada no arquivo", "error");
          return;
        }
        setWeeks((prev) => mergeWeeks(prev, newWeeks));
        showToast(`${newWeeks.length} semana(s) importada(s) com sucesso!`);
      } else {
        showToast("Formato de CSV não reconhecido", "error");
      }
    } catch (e) {
      showToast("Erro ao processar arquivo: " + e.message, "error");
    }
  };

  const handleFiles = async (files) => {
    if (!files || files.length === 0) return;
    for (const f of files) {
      await handleFile(f);
    }
  };

  const handleDrop = (e) => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length > 0) handleFiles(files);
  };

  const clearAll = async () => {
    const target = activeTab === "ops" ? "operações granulares" : "planilha semanal";
    if (!confirm(`Tem certeza que deseja apagar TODOS os dados de ${target}?`)) return;
    try {
      if (activeTab === "ops") {
        await window.storage.delete("signals-ops");
        setOps([]);
        showToast("Operações apagadas");
      } else {
        await window.storage.delete("signals-weeks");
        setWeeks([]);
        showToast("Dados semanais apagados");
      }
    } catch (e) {
      showToast("Erro: " + e.message, "error");
    }
  };

  const restoreInitial = async () => {
    if (!confirm("Restaurar TODOS os dados originais (planilhas + operações)? Isso vai substituir tudo.")) return;
    setWeeks(INITIAL_WEEKS);
    setOps(INITIAL_OPS);
    showToast(`${INITIAL_WEEKS.length} semanas e ${INITIAL_OPS.length} operações restauradas`);
  };

  const exportCSV = () => {
    let rows, filename;
    if (activeTab === "ops") {
      rows = [["Data", "Hora", "Timeframe", "Ativo", "Estratégia", "Rank", "Tipo", "Preço", "Resultado"]];
      ops.forEach((o) => {
        rows.push([o.date, o.time, o.timeframe, o.ativo, o.strategy, o.rank, o.type, o.price, o.result]);
      });
      filename = `operacoes_export_${Date.now()}.csv`;
    } else {
      rows = [["Semana", "Dia", "Hora", "Win", "Loss", "Winrate"]];
      weeks.forEach((w) => {
        Object.entries(w.hours).forEach(([h, days]) => {
          Object.entries(days).forEach(([d, stats]) => {
            if (stats.win > 0 || stats.loss > 0) {
              rows.push([w.label, d, h, stats.win, stats.loss, stats.winrate]);
            }
          });
        });
      });
      filename = `sinais_export_${Date.now()}.csv`;
    }
    const csv = rows.map((r) => r.map((c) => `"${c}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  // ==================== ANÁLISES ====================
  const filteredWeeks = selectedWeek === "ALL"
    ? weeks
    : weeks.filter((w) => w.label === selectedWeek);

  const stats = useMemo(() => {
    let totalWin = 0, totalLoss = 0;
    filteredWeeks.forEach((w) => {
      Object.values(w.hours).forEach((days) => {
        Object.values(days).forEach((s) => {
          totalWin += s.win;
          totalLoss += s.loss;
        });
      });
    });
    const totalOps = totalWin + totalLoss;
    const winRate = totalOps > 0 ? (totalWin / totalOps) * 100 : 0;
    return { totalWin, totalLoss, totalOps, winRate };
  }, [filteredWeeks]);

  // Winrate por dia da semana (agregado)
  const byDay = useMemo(() => {
    const agg = {};
    DAYS.forEach((d) => (agg[d] = { win: 0, loss: 0 }));
    filteredWeeks.forEach((w) => {
      Object.values(w.hours).forEach((days) => {
        Object.entries(days).forEach(([d, s]) => {
          agg[d].win += s.win;
          agg[d].loss += s.loss;
        });
      });
    });
    return DAYS.map((d, i) => {
      const total = agg[d].win + agg[d].loss;
      return {
        day: DAYS_SHORT[i],
        fullDay: d,
        win: agg[d].win,
        loss: agg[d].loss,
        total,
        winrate: total > 0 ? (agg[d].win / total) * 100 : 0,
      };
    });
  }, [filteredWeeks]);

  // Winrate por hora
  const byHour = useMemo(() => {
    const agg = {};
    HOURS.forEach((h) => (agg[h] = { win: 0, loss: 0 }));
    filteredWeeks.forEach((w) => {
      Object.entries(w.hours).forEach(([h, days]) => {
        if (!agg[h]) agg[h] = { win: 0, loss: 0 };
        Object.values(days).forEach((s) => {
          agg[h].win += s.win;
          agg[h].loss += s.loss;
        });
      });
    });
    return HOURS.map((h) => {
      const total = agg[h].win + agg[h].loss;
      return {
        hour: h,
        win: agg[h].win,
        loss: agg[h].loss,
        total,
        winrate: total > 0 ? (agg[h].win / total) * 100 : 0,
      };
    }).filter((x) => x.total > 0);
  }, [filteredWeeks]);

  // Evolução da banca ao longo das semanas
  const bancaEvolution = useMemo(() => {
    const data = [];
    weeks.forEach((w) => {
      DAYS.forEach((d, i) => {
        const banca = w.banca[d] || 0;
        const valorDia = w.valorDia[d] || 0;
        if (banca > 0 || valorDia > 0) {
          data.push({
            label: `${w.label.replace("SEMANA ", "")} ${DAYS_SHORT[i]}`,
            banca,
            valorDia,
            week: w.label,
          });
        }
      });
    });
    return data;
  }, [weeks]);

  // Heatmap: winrate por hora × dia
  const heatmapData = useMemo(() => {
    const matrix = {};
    HOURS.forEach((h) => {
      matrix[h] = {};
      DAYS.forEach((d) => (matrix[h][d] = { win: 0, loss: 0 }));
    });
    filteredWeeks.forEach((w) => {
      Object.entries(w.hours).forEach(([h, days]) => {
        Object.entries(days).forEach(([d, s]) => {
          if (matrix[h] && matrix[h][d]) {
            matrix[h][d].win += s.win;
            matrix[h][d].loss += s.loss;
          }
        });
      });
    });
    return matrix;
  }, [filteredWeeks]);

  const heatmapColor = (wr, total) => {
    if (total === 0) return "rgba(30,41,59,0.3)";
    if (wr >= 75) return "rgba(34,197,94,0.95)";
    if (wr >= 65) return "rgba(34,197,94,0.7)";
    if (wr >= 55) return "rgba(132,204,22,0.6)";
    if (wr >= 45) return "rgba(234,179,8,0.6)";
    if (wr >= 35) return "rgba(249,115,22,0.7)";
    return "rgba(239,68,68,0.8)";
  };

  // Melhor e pior HORÁRIO POR DIA DA SEMANA
  // Estrutura: { DOMINGO: { best: [top 5 horários], worst: [piores 5] }, SEGUNDA: {...}, ... }
  // Para cada dia, agrega TODAS as semanas e ordena os horários
  const bestWorstByDay = useMemo(() => {
    const result = {};
    DAYS.forEach((day) => {
      const entries = HOURS.map((h) => {
        const m = heatmapData[h]?.[day] || { win: 0, loss: 0 };
        const total = m.win + m.loss;
        return {
          hour: h,
          win: m.win,
          loss: m.loss,
          total,
          winrate: total > 0 ? (m.win / total) * 100 : 0,
        };
      }).filter((e) => e.total >= 3); // mínimo 3 operações pra entrar no ranking
      if (entries.length === 0) {
        result[day] = { best: [], worst: [], totalOps: 0 };
        return;
      }
      const totalOps = entries.reduce((sum, e) => sum + e.total, 0);
      const best = [...entries].sort((a, b) => b.winrate - a.winrate || b.total - a.total).slice(0, 5);
      const worst = [...entries].sort((a, b) => a.winrate - b.winrate || b.total - a.total).slice(0, 5);
      result[day] = { best, worst, totalOps };
    });
    return result;
  }, [heatmapData]);

  // Dias da semana que têm dados (pra não mostrar cards vazios)
  const daysWithData = useMemo(() => {
    return DAYS.filter((d) => bestWorstByDay[d]?.totalOps > 0);
  }, [bestWorstByDay]);

  // ==================== ANÁLISES DE OPERAÇÕES ====================
  // Lista filtrada de ops segundo filtros
  const filteredOps = useMemo(() => {
    return ops.filter((o) => {
      if (opsFilter.ativo !== "ALL" && o.ativo !== opsFilter.ativo) return false;
      if (opsFilter.rank !== "ALL" && o.rank !== opsFilter.rank) return false;
      if (opsFilter.type !== "ALL" && o.type !== opsFilter.type) return false;
      if (opsFilter.result !== "ALL" && o.result !== opsFilter.result) return false;
      if (opsFilter.date !== "ALL" && o.date !== opsFilter.date) return false;
      return true;
    });
  }, [ops, opsFilter]);

  // Valores únicos para filtros
  const uniqueAssets = useMemo(() => [...new Set(ops.map((o) => o.ativo))].sort(), [ops]);
  const uniqueRanks = useMemo(() => [...new Set(ops.map((o) => o.rank))].sort(), [ops]);
  const uniqueDates = useMemo(() => [...new Set(ops.map((o) => o.date))].sort(), [ops]);

  // Stats gerais da aba ops
  const opsStats = useMemo(() => {
    let win = 0, loss = 0, pending = 0;
    filteredOps.forEach((o) => {
      if (o.result === "WIN") win++;
      else if (o.result === "LOSS") loss++;
      else pending++;
    });
    const total = win + loss;
    return { win, loss, pending, total, winrate: total > 0 ? (win / total) * 100 : 0 };
  }, [filteredOps]);

  // WR por ativo
  const byAsset = useMemo(() => {
    const agg = {};
    filteredOps.forEach((o) => {
      if (!agg[o.ativo]) agg[o.ativo] = { win: 0, loss: 0 };
      if (o.result === "WIN") agg[o.ativo].win++;
      else if (o.result === "LOSS") agg[o.ativo].loss++;
    });
    return Object.entries(agg)
      .map(([asset, s]) => ({
        asset,
        win: s.win,
        loss: s.loss,
        total: s.win + s.loss,
        winrate: s.win + s.loss > 0 ? (s.win / (s.win + s.loss)) * 100 : 0,
      }))
      .sort((a, b) => b.winrate - a.winrate);
  }, [filteredOps]);

  // WR por rank
  const byRank = useMemo(() => {
    const agg = {};
    filteredOps.forEach((o) => {
      if (!agg[o.rank]) agg[o.rank] = { win: 0, loss: 0, full: o.rankFull };
      if (o.result === "WIN") agg[o.rank].win++;
      else if (o.result === "LOSS") agg[o.rank].loss++;
    });
    return Object.entries(agg)
      .map(([rank, s]) => ({
        rank,
        rankFull: s.full,
        win: s.win,
        loss: s.loss,
        total: s.win + s.loss,
        winrate: s.win + s.loss > 0 ? (s.win / (s.win + s.loss)) * 100 : 0,
      }))
      .sort((a, b) => a.rank.localeCompare(b.rank));
  }, [filteredOps]);

  // WR por tipo (CALL/PUT)
  const byType = useMemo(() => {
    const agg = { CALL: { win: 0, loss: 0 }, PUT: { win: 0, loss: 0 } };
    filteredOps.forEach((o) => {
      if (!agg[o.type]) return;
      if (o.result === "WIN") agg[o.type].win++;
      else if (o.result === "LOSS") agg[o.type].loss++;
    });
    return ["CALL", "PUT"].map((t) => {
      const s = agg[t];
      const total = s.win + s.loss;
      return { type: t, win: s.win, loss: s.loss, total, winrate: total > 0 ? (s.win / total) * 100 : 0 };
    });
  }, [filteredOps]);

  // WR por hora (só o número da hora da operação)
  const opsByHour = useMemo(() => {
    const agg = {};
    for (let h = 0; h < 24; h++) agg[h] = { win: 0, loss: 0 };
    filteredOps.forEach((o) => {
      const h = parseInt(String(o.time).split(":")[0] || "0", 10);
      if (!agg[h]) agg[h] = { win: 0, loss: 0 };
      if (o.result === "WIN") agg[h].win++;
      else if (o.result === "LOSS") agg[h].loss++;
    });
    return Object.entries(agg).map(([h, s]) => ({
      hour: `${String(h).padStart(2, "0")}h`,
      hourNum: parseInt(h, 10),
      win: s.win,
      loss: s.loss,
      total: s.win + s.loss,
      winrate: s.win + s.loss > 0 ? (s.win / (s.win + s.loss)) * 100 : 0,
    })).filter((x) => x.total > 0).sort((a, b) => a.hourNum - b.hourNum);
  }, [filteredOps]);

  // Matriz Ativo × Rank (heatmap combinado)
  const assetRankMatrix = useMemo(() => {
    const matrix = {};
    uniqueAssets.forEach((a) => {
      matrix[a] = {};
      uniqueRanks.forEach((r) => {
        matrix[a][r] = { win: 0, loss: 0 };
      });
    });
    filteredOps.forEach((o) => {
      if (matrix[o.ativo]?.[o.rank]) {
        if (o.result === "WIN") matrix[o.ativo][o.rank].win++;
        else if (o.result === "LOSS") matrix[o.ativo][o.rank].loss++;
      }
    });
    return matrix;
  }, [filteredOps, uniqueAssets, uniqueRanks]);

  // === MELHORES HORÁRIOS por Ativo em cada Dia da Semana ===
  // Estrutura: { ATIVO: { DIA: [{hour, win, loss, winrate, total}, ...] } }
  const bestHoursByAssetDay = useMemo(() => {
    const matrix = {};
    filteredOps.forEach((o) => {
      if (o.result !== "WIN" && o.result !== "LOSS") return;
      const dayName = getDayName(o.date);
      const hourNum = parseInt(String(o.time).split(":")[0] || "0", 10);
      if (!matrix[o.ativo]) matrix[o.ativo] = {};
      if (!matrix[o.ativo][dayName]) matrix[o.ativo][dayName] = {};
      if (!matrix[o.ativo][dayName][hourNum]) {
        matrix[o.ativo][dayName][hourNum] = { win: 0, loss: 0 };
      }
      if (o.result === "WIN") matrix[o.ativo][dayName][hourNum].win++;
      else matrix[o.ativo][dayName][hourNum].loss++;
    });
    // Converter em arrays ordenados por winrate
    const result = {};
    Object.entries(matrix).forEach(([asset, daysMap]) => {
      result[asset] = {};
      Object.entries(daysMap).forEach(([day, hoursMap]) => {
        const hourList = Object.entries(hoursMap).map(([h, s]) => ({
          hour: parseInt(h, 10),
          win: s.win,
          loss: s.loss,
          total: s.win + s.loss,
          winrate: s.win + s.loss > 0 ? (s.win / (s.win + s.loss)) * 100 : 0,
        }));
        // Ordenar por winrate desc, mas tie-breaker por volume
        hourList.sort((a, b) => b.winrate - a.winrate || b.total - a.total);
        result[asset][day] = hourList;
      });
    });
    return result;
  }, [filteredOps]);

  // Dias da semana que tem dados (para não mostrar dias vazios)
  const activeWeekDays = useMemo(() => {
    const daysWith = new Set();
    filteredOps.forEach((o) => {
      if (o.result === "WIN" || o.result === "LOSS") {
        daysWith.add(getDayName(o.date));
      }
    });
    return DAYS.filter((d) => daysWith.has(d));
  }, [filteredOps]);

  // ==================== RENDER ====================
  if (loading) {
    return (
      <div className="min-h-screen bg-slate-950 flex items-center justify-center">
        <div className="text-emerald-400 font-mono text-sm tracking-widest animate-pulse">
          CARREGANDO DADOS...
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
      {/* Background grid pattern */}
      <div
        className="fixed inset-0 opacity-[0.03] pointer-events-none"
        style={{
          backgroundImage:
            "linear-gradient(rgba(16,185,129,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.5) 1px, transparent 1px)",
          backgroundSize: "40px 40px",
        }}
      />

      {/* TOAST */}
      {toast && (
        <div
          className={`fixed top-6 right-6 z-50 px-5 py-3 rounded-lg backdrop-blur-xl border flex items-center gap-3 shadow-2xl ${
            toast.type === "error"
              ? "bg-red-950/80 border-red-500/50 text-red-200"
              : "bg-emerald-950/80 border-emerald-500/50 text-emerald-200"
          }`}
        >
          {toast.type === "error" ? <AlertCircle size={18} /> : <Check size={18} />}
          <span className="text-sm font-medium">{toast.msg}</span>
        </div>
      )}

      <div className="relative max-w-7xl mx-auto px-6 py-8">
        {/* HEADER */}
        <header className="mb-10">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <div className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse" />
                <span className="text-emerald-400 text-xs font-mono tracking-[0.2em] uppercase">
                  Signals Dashboard · Live
                </span>
              </div>
              <h1 className="text-4xl md:text-5xl font-black tracking-tight">
                <span className="bg-gradient-to-r from-emerald-300 via-emerald-400 to-teal-500 bg-clip-text text-transparent">
                  Trading Signals
                </span>
              </h1>
              <p className="text-slate-400 mt-2 text-sm">
                Análise completa · Win rate · Banca · Heatmap temporal
              </p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button
                onClick={() => fileInputRef.current?.click()}
                className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2 transition-all shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/40"
              >
                <Upload size={16} />
                Importar CSV
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".csv"
                multiple
                onChange={(e) => handleFiles(e.target.files)}
                className="hidden"
              />
              <button
                onClick={exportCSV}
                disabled={weeks.length === 0}
                className="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 px-4 py-2.5 rounded-lg flex items-center gap-2 border border-slate-700 transition-all"
              >
                <Download size={16} />
                Exportar
              </button>
              <button
                onClick={restoreInitial}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-lg flex items-center gap-2 border border-slate-700 transition-all"
                title="Restaurar dados originais da planilha"
              >
                <RefreshCw size={16} />
                Restaurar
              </button>
              <button
                onClick={clearAll}
                disabled={weeks.length === 0}
                className="bg-red-950/50 hover:bg-red-900/60 disabled:opacity-40 disabled:cursor-not-allowed text-red-300 px-4 py-2.5 rounded-lg flex items-center gap-2 border border-red-800/50 transition-all"
              >
                <Trash2 size={16} />
                Limpar
              </button>
            </div>
          </div>
        </header>

        {/* TABS */}
        <div className="mb-6 flex items-center gap-1 p-1 bg-slate-900/60 backdrop-blur rounded-xl border border-slate-800 inline-flex flex-wrap">
          <button
            onClick={() => setActiveTab("weekly")}
            className={`px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all ${
              activeTab === "weekly"
                ? "bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20"
                : "text-slate-400 hover:text-slate-200"
            }`}
          >
            <Calendar size={15} />
            Planilha Semanal
            <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${activeTab === "weekly" ? "bg-slate-950/20" : "bg-slate-800"}`}>
              {weeks.length}
            </span>
          </button>
          <button
            onClick={() => setActiveTab("ops")}
            className={`px-5 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all ${
              activeTab === "ops"
                ? "bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20"
                : "text-slate-400 hover:text-slate-200"
            }`}
            title="Análise detalhada por ativo e rank (após importar CSVs granulares)"
          >
            <Coins size={15} />
            Ativos & Ranks
            <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${activeTab === "ops" ? "bg-slate-950/20" : "bg-slate-800"}`}>
              {ops.length}
            </span>
          </button>
        </div>

        {/* BANNER INFORMATIVO sobre formato dos CSVs */}
        <div className="mb-6 bg-gradient-to-r from-emerald-950/40 to-slate-900/40 border border-emerald-800/30 rounded-lg p-3 text-xs text-slate-300 flex items-start gap-3">
          <Zap size={14} className="text-emerald-400 flex-shrink-0 mt-0.5" />
          <div className="flex-1">
            <strong className="text-emerald-300">Importação inteligente:</strong>{" "}
            Arquivos CSV são detectados automaticamente. CSVs detalhados (ex: <code className="text-emerald-400">18_04_DAIMONDS.csv</code>) alimentam a planilha semanal <em>E</em> a análise de ativos/ranks simultaneamente. Semanas são organizadas de <strong>Domingo a Sábado</strong>.
          </div>
        </div>

        {/* ========== ABA: PLANILHA SEMANAL ========== */}
        {activeTab === "weekly" && weeks.length === 0 && (
          <div
            onDragOver={(e) => e.preventDefault()}
            onDrop={handleDrop}
            className="border-2 border-dashed border-emerald-500/30 rounded-2xl p-16 text-center bg-gradient-to-br from-emerald-950/20 to-slate-900/40 backdrop-blur hover:border-emerald-500/60 transition-all cursor-pointer"
            onClick={() => fileInputRef.current?.click()}
          >
            <div className="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-500/10 mb-6">
              <Upload className="text-emerald-400" size={36} />
            </div>
            <h2 className="text-2xl font-bold mb-2">Importe seus sinais</h2>
            <p className="text-slate-400 mb-6 max-w-md mx-auto">
              Arraste um arquivo CSV aqui ou clique para selecionar. O dashboard
              irá processar automaticamente e organizar tudo.
            </p>
            <div className="text-xs text-slate-500 font-mono">
              Formato: Hora / Dias × (WIN, LOSS, WINRATE) por semana
            </div>
          </div>
        )}

        {activeTab === "weekly" && weeks.length > 0 && (
          <>
            {/* WEEK FILTER */}
            <div className="mb-8 flex items-center gap-3 flex-wrap">
              <span className="text-xs text-slate-400 uppercase tracking-wider font-mono">
                Filtro:
              </span>
              <button
                onClick={() => setSelectedWeek("ALL")}
                className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${
                  selectedWeek === "ALL"
                    ? "bg-emerald-500 text-slate-950"
                    : "bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800"
                }`}
              >
                Todas ({weeks.length})
              </button>
              {weeks.map((w) => (
                <button
                  key={w.label}
                  onClick={() => setSelectedWeek(w.label)}
                  className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${
                    selectedWeek === w.label
                      ? "bg-emerald-500 text-slate-950"
                      : "bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800"
                  }`}
                >
                  {w.label.replace("SEMANA ", "")}
                </button>
              ))}
            </div>

            {/* KPI CARDS */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <KpiCard
                icon={<Activity size={18} />}
                label="Total Operações"
                value={stats.totalOps.toLocaleString("pt-BR")}
                accent="from-blue-500/20 to-blue-500/5"
                iconColor="text-blue-400"
              />
              <KpiCard
                icon={<Target size={18} />}
                label="Win Rate"
                value={`${stats.winRate.toFixed(2)}%`}
                accent="from-emerald-500/20 to-emerald-500/5"
                iconColor="text-emerald-400"
                highlight
              />
              <KpiCard
                icon={<TrendingUp size={18} />}
                label="Wins"
                value={stats.totalWin.toLocaleString("pt-BR")}
                accent="from-green-500/20 to-green-500/5"
                iconColor="text-green-400"
              />
              <KpiCard
                icon={<TrendingDown size={18} />}
                label="Losses"
                value={stats.totalLoss.toLocaleString("pt-BR")}
                accent="from-red-500/20 to-red-500/5"
                iconColor="text-red-400"
              />
            </div>

            {/* HEATMAP */}
            <Card title="Heatmap · Hora × Dia" icon={<BarChart3 size={18} />}>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr>
                      <th className="text-slate-500 font-mono p-2 text-left">HORA</th>
                      {DAYS_SHORT.map((d) => (
                        <th key={d} className="text-slate-400 font-mono p-2">{d}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {HOURS.map((h) => {
                      const hasData = DAYS.some((d) => {
                        const m = heatmapData[h]?.[d];
                        return m && (m.win + m.loss > 0);
                      });
                      if (!hasData) return null;
                      return (
                        <tr key={h}>
                          <td className="text-slate-500 font-mono p-1.5 text-left">{h}</td>
                          {DAYS.map((d) => {
                            const m = heatmapData[h]?.[d] || { win: 0, loss: 0 };
                            const total = m.win + m.loss;
                            const wr = total > 0 ? (m.win / total) * 100 : 0;
                            return (
                              <td key={d} className="p-0.5">
                                <div
                                  className="rounded-md py-2 px-1 text-center font-semibold text-[11px] transition-transform hover:scale-110 cursor-pointer"
                                  style={{
                                    background: heatmapColor(wr, total),
                                    color: total === 0 ? "#475569" : "#0f172a",
                                  }}
                                  title={total > 0 ? `${m.win}W / ${m.loss}L · ${wr.toFixed(1)}%` : "Sem dados"}
                                >
                                  {total > 0 ? `${wr.toFixed(0)}%` : "—"}
                                </div>
                              </td>
                            );
                          })}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="flex items-center gap-3 mt-4 text-xs text-slate-400">
                <span>Escala:</span>
                {[
                  ["#ef4444", "<35%"],
                  ["#f97316", "35-45%"],
                  ["#eab308", "45-55%"],
                  ["#84cc16", "55-65%"],
                  ["#10b981", "65-75%"],
                  ["#059669", "75%+"],
                ].map(([c, l]) => (
                  <span key={l} className="flex items-center gap-1">
                    <span className="w-3 h-3 rounded" style={{ background: c }} />
                    {l}
                  </span>
                ))}
              </div>
            </Card>

            {/* TABELA DETALHADA DA SEMANA (estilo planilha original) */}
            {selectedWeek !== "ALL" && (() => {
              const wk = weeks.find((w) => w.label === selectedWeek);
              if (!wk) return null;
              // quais dias tem dados?
              const activeDays = DAYS.filter((d) =>
                Object.values(wk.hours).some((h) => h[d] && (h[d].win > 0 || h[d].loss > 0))
                || (wk.totals[d] && (wk.totals[d].win > 0 || wk.totals[d].loss > 0))
                || wk.banca[d] || wk.entrada[d] || wk.valorDia[d] || wk.valorReais[d]
              );
              const displayDays = activeDays.length > 0 ? activeDays : DAYS;
              // só mostrar horas com qualquer dado
              const activeHours = HOURS.filter((h) =>
                displayDays.some((d) => {
                  const s = wk.hours[h]?.[d];
                  return s && (s.win > 0 || s.loss > 0);
                })
              );
              const cellCls = "border border-slate-800 px-2 py-1.5 text-center text-[11px]";
              return (
                <div className="mt-6">
                  <Card title={`Detalhe: ${wk.label}`} icon={<Calendar size={18} />}>
                    <div className="overflow-x-auto">
                      <table className="w-full border-collapse text-[11px]">
                        <thead>
                          <tr className="bg-slate-900/80">
                            <th className={cellCls + " text-emerald-400 font-bold sticky left-0 bg-slate-900 z-10"}>HORA</th>
                            {displayDays.map((d, i) => (
                              <th key={d} colSpan={3} className={cellCls + " text-emerald-300 font-bold"}>
                                {DAYS_SHORT[DAYS.indexOf(d)]}
                              </th>
                            ))}
                          </tr>
                          <tr className="bg-slate-900/60">
                            <th className={cellCls + " sticky left-0 bg-slate-900 z-10"}></th>

                        let banca = simConfig.bancaInicial;
                        const pct = simConfig.percentEntrada / 100;
                        const payoutRate = simConfig.payout / 100;

                              const vd = t.win * entrada * payoutRate - t.loss * entrada;
                              banca = banca + vd;

                              </tbody>
                            </table>
                          </div>
                        );
                      })()}

                      </div>

                  </thead>
                  <tbody>
                    {uniqueAssets.map((a) => (
                      <tr key={a}>
                        <td className="font-mono font-bold text-emerald-300 p-2 sticky left-0 bg-slate-950 z-10">{a}</td>
                        {uniqueRanks.map((r) => {
                          const m = assetRankMatrix[a]?.[r] || { win: 0, loss: 0 };
                          const total = m.win + m.loss;
                          const wr = total > 0 ? (m.win / total) * 100 : 0;
                          const bg = total === 0 ? "rgba(30,41,59,0.3)"
                            : wr >= 75 ? "rgba(34,197,94,0.95)"
                            : wr >= 65 ? "rgba(34,197,94,0.7)"
                            : wr >= 55 ? "rgba(132,204,22,0.6)"
                            : wr >= 45 ? "rgba(234,179,8,0.6)"
                            : wr >= 35 ? "rgba(249,115,22,0.7)"
                            : "rgba(239,68,68,0.8)";
                          return (
                            <td key={r} className="p-0.5">
                              <div
                                className="rounded-md py-2 px-1 text-center font-semibold text-[11px] cursor-help"
                                style={{ background: bg, color: total === 0 ? "#475569" : "#0f172a" }}
                                title={total > 0 ? `${m.win}W / ${m.loss}L · ${wr.toFixed(1)}%` : "Sem dados"}
                              >
                                {total > 0 ? (
                                  <>
                                    <div>{wr.toFixed(0)}%</div>
                                    <div className="text-[9px] opacity-70">{total}</div>
                                  </>
                                ) : "—"}
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>

            {/* MELHORES HORÁRIOS POR ATIVO × DIA DA SEMANA */}
            <div className="mt-6">
              <Card title="Melhores Horários: Ativo × Dia da Semana" icon={<Clock size={18} />}>
                <div className="mb-3 text-[11px] text-slate-400">
                  Top 5 horários de maior win rate para cada ativo em cada dia — auto-atualiza com novos CSVs
                </div>
                {activeWeekDays.length === 0 ? (
                  <div className="text-center py-6 text-slate-500 text-sm">Sem dados de operações ainda.</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full border-collapse text-[11px]">
                      <thead>
                        <tr className="bg-slate-900/80">
                          <th className="border border-slate-800 p-2 text-left text-emerald-400 font-mono sticky left-0 bg-slate-900 z-10">ATIVO</th>
                          {activeWeekDays.map((d) => (
                            <th key={d} className="border border-slate-800 p-2 text-emerald-300 font-bold">
                              {DAYS_SHORT[DAYS.indexOf(d)]}
                            </th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {uniqueAssets.map((asset) => (
                          <tr key={asset}>
                            <td className="border border-slate-800 p-2 font-bold text-emerald-300 sticky left-0 bg-slate-950 z-10">
                              {asset}
                            </td>
                            {activeWeekDays.map((d) => {
                              const list = bestHoursByAssetDay[asset]?.[d] || [];
                              const top = list.filter((x) => x.total >= 1).slice(0, 5);
                              if (top.length === 0) {
                                return (
                                  <td key={d} className="border border-slate-800 p-2 text-center text-slate-700">
                                    —
                                  </td>
                                );
                              }
                              return (
                                <td key={d} className="border border-slate-800 p-1 align-top">
                                  <div className="space-y-1">
                                    {top.map((h, idx) => {
                                      const wrColor = h.winrate >= 70 ? "bg-emerald-500 text-slate-950"
                                        : h.winrate >= 55 ? "bg-lime-500 text-slate-950"
                                        : h.winrate >= 45 ? "bg-yellow-500 text-slate-950"
                                        : "bg-red-500 text-slate-950";
                                      return (
                                        <div key={idx} className="flex items-center justify-between gap-1 px-1.5 py-0.5 rounded bg-slate-900/60">
                                          <span className="font-mono text-[10px] text-slate-300 font-bold">
                                            {String(h.hour).padStart(2, "0")}h
                                          </span>
                                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded font-mono ${wrColor}`}>
                                            {h.winrate.toFixed(0)}%
                                          </span>
                                          <span className="text-[9px] font-mono text-slate-500">
                                            {h.win}/{h.total}
                                          </span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
                <div className="mt-3 text-[10px] text-slate-500 font-mono leading-relaxed">
                  Cada célula mostra os 5 horários com maior win rate daquele ativo no dia. Formato: <span className="text-emerald-400">HORA · WR% · WINS/TOTAL</span>.
                  Verde ≥ 70% · Lima ≥ 55% · Amarelo ≥ 45% · Vermelho &lt; 45%.
                </div>
              </Card>
            </div>

            {/* TABELA DE OPERAÇÕES */}
            <div className="mt-6">
              <Card title={`Operações (${filteredOps.length}${filteredOps.length !== ops.length ? ` de ${ops.length}` : ""})`} icon={<List size={18} />}>
                <OpsTable ops={filteredOps} />
              </Card>
            </div>
          </>
        )}

        {/* FECHA ABA WEEKLY */}
        <footer className="mt-12 pt-6 border-t border-slate-900 text-center text-xs text-slate-600 font-mono">
          Dados salvos localmente no navegador · {weeks.length} semana(s) registrada(s)
        </footer>
      </div>
    </div>
  );
}

// ==================== SUBCOMPONENTS ====================
function KpiCard({ icon, label, value, accent, iconColor, highlight }) {
  return (
    <div
      className={`relative overflow-hidden rounded-xl border ${
        highlight ? "border-emerald-500/40" : "border-slate-800"
      } bg-slate-900/60 backdrop-blur p-5 group hover:border-slate-700 transition-all`}
    >
      <div className={`absolute inset-0 bg-gradient-to-br ${accent} opacity-60 group-hover:opacity-100 transition-opacity`} />
      <div className="relative">
        <div className="flex items-center justify-between mb-3">
          <span className={iconColor}>{icon}</span>
          {highlight && (
            <span className="text-[9px] font-mono text-emerald-400 tracking-widest uppercase">
              Primary
            </span>
          )}
        </div>
        <div className="text-[10px] text-slate-400 uppercase tracking-widest font-mono mb-1">
          {label}
        </div>
        <div className={`text-3xl font-black ${highlight ? "text-emerald-300" : "text-slate-100"}`}>
          {value}
        </div>
      </div>
    </div>
  );
}

function Card({ title, icon, children, accent }) {
  const accentColor = {
    emerald: "border-emerald-900/40",
    red: "border-red-900/40",
  }[accent] || "border-slate-800";

  return (
    <div className={`bg-slate-900/40 backdrop-blur border ${accentColor} rounded-xl p-5 mb-0`}>
      <div className="flex items-center gap-2 mb-4 text-slate-300">
        <span className="text-slate-500">{icon}</span>
        <h3 className="font-semibold tracking-tight">{title}</h3>
      </div>
      {children}
    </div>
  );
}

function ConfigInput({ label, prefix, suffix, value, onChange, step = 0.01 }) {
  return (
    <label className="block">
      <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-mono mb-1.5">
        {label}
      </span>
      <div className="flex items-center bg-slate-950 border border-slate-700 rounded-md overflow-hidden focus-within:border-emerald-500 transition-colors">
        {prefix && (
          <span className="px-2 text-slate-500 text-xs font-mono select-none">{prefix}</span>
        )}
        <input
          type="number"
          step={step}
          value={value}
          onChange={(e) => {
            const v = parseFloat(e.target.value);
            if (!isNaN(v)) onChange(v);
            else if (e.target.value === "") onChange(0);
          }}
          className="flex-1 bg-transparent py-2 px-1 text-sm text-emerald-300 font-bold font-mono outline-none w-full min-w-0"
        />
        {suffix && (
          <span className="px-2 text-slate-500 text-xs font-mono select-none">{suffix}</span>
        )}
      </div>
    </label>
  );
}
function FilterSelect({ label, value, options, onChange }) {
  return (
    <label className="block">
      <span className="block text-[10px] text-slate-400 uppercase tracking-widest font-mono mb-1.5">
        {label}
      </span>
      <select
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-full bg-slate-950 border border-slate-700 rounded-md px-2 py-2 text-xs text-emerald-300 font-mono outline-none focus:border-emerald-500 transition-colors cursor-pointer"
      >
        {options.map(([val, lbl]) => (
          <option key={val} value={val} className="bg-slate-950">
            {lbl}
          </option>
        ))}
      </select>
    </label>
  );
}

function OpsTable({ ops }) {
  const [page, setPage] = useState(0);
  const pageSize = 50;
  const totalPages = Math.max(1, Math.ceil(ops.length / pageSize));
  const currentPage = Math.min(page, totalPages - 1);
  const start = currentPage * pageSize;
  const slice = ops.slice(start, start + pageSize);

  if (ops.length === 0) {
    return (
      <div className="text-center py-8 text-slate-500 text-sm font-mono">
        Nenhuma operação com os filtros atuais
      </div>
    );
  }

  return (
    <div>
      <div className="overflow-x-auto">
        <table className="w-full border-collapse text-[11px]">
          <thead>
            <tr className="bg-slate-900/80">
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono text-left">DATA</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono text-left">HORA</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono">TF</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono">ATIVO</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono">RANK</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono">TIPO</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono text-right">PREÇO</th>
              <th className="border border-slate-800 px-2 py-1.5 text-emerald-400 font-mono">RESULT</th>
            </tr>
          </thead>
          <tbody>
            {slice.map((o) => (
              <tr key={o.id} className="hover:bg-slate-900/40">
                <td className="border border-slate-800 px-2 py-1.5 font-mono text-slate-300">{o.date}</td>
                <td className="border border-slate-800 px-2 py-1.5 font-mono text-slate-300">{o.time}</td>
                <td className="border border-slate-800 px-2 py-1.5 text-center font-mono text-slate-400">{o.timeframe}</td>
                <td className="border border-slate-800 px-2 py-1.5 text-center font-bold text-emerald-300">{o.ativo}</td>
                <td className="border border-slate-800 px-2 py-1.5 text-center font-mono text-slate-300">{o.rank}</td>
                <td className={`border border-slate-800 px-2 py-1.5 text-center font-bold ${o.type === "CALL" ? "text-emerald-400" : "text-red-400"}`}>
                  {o.type}
                </td>
                <td className="border border-slate-800 px-2 py-1.5 text-right font-mono text-slate-400">
                  {o.price.toLocaleString("pt-BR", { minimumFractionDigits: 4, maximumFractionDigits: 5 })}
                </td>
                <td className={`border border-slate-800 px-2 py-1.5 text-center font-bold ${
                  o.result === "WIN" ? "text-emerald-400" :
                  o.result === "LOSS" ? "text-red-400" : "text-yellow-400"
                }`}>
                  {o.result}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {totalPages > 1 && (
        <div className="mt-4 flex items-center justify-between text-xs text-slate-400 font-mono">
          <span>
            Mostrando {start + 1}–{Math.min(start + pageSize, ops.length)} de {ops.length}
          </span>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setPage(Math.max(0, currentPage - 1))}
              disabled={currentPage === 0}
              className="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700"
            >
              ← Anterior
            </button>
            <span className="px-3">
              Página {currentPage + 1} / {totalPages}
            </span>
            <button
              onClick={() => setPage(Math.min(totalPages - 1, currentPage + 1))}
              disabled={currentPage >= totalPages - 1}
              className="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-700"
            >
              Próxima →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}


// ============ RENDERIZAR ============
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<SignalsDashboard />);
</script>

</body>
</html>
